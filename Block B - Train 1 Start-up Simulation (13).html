<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block B – Train 1 Start-up Simulation</title>
<style>
:root{
  --bg:#0a111c; --panel:#101a29; --line:#1f2e44; --txt:#d6e4f5; --mut:#7f93ad;
  --cold:#38bdf8; --hot:#fb923c; --mo:#a78bfa; --syn:#34d399; --seal:#2dd4bf;
  --fuel:#facc15; --air:#93c5fd; --exh:#f87171; --hyd:#f472b6; --eq:#1c3555; --eqs:#4f7fae;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{color:var(--mut);font-size:12.5px}
.ctl{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{background:#172438;color:var(--txt);border:1px solid #2a3d59;border-radius:6px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
button:hover{background:#1e3050}
button.on{background:#244a7a;border-color:#3b6fb0}
button.trip{border-color:#7f1d1d;background:#3a1414}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:0;min-height:calc(100vh - 56px)}
.stage{position:relative;padding:6px 8px 4px}
svg#plant{width:100%;height:auto;display:block}
aside{border-left:1px solid var(--line);background:var(--panel);padding:12px 14px;overflow:auto;max-height:calc(100vh - 56px)}
aside h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;font-weight:600}
.phase-now{font-size:18px;font-weight:600;margin:0 0 2px}
.phase-real{color:var(--mut);font-size:12px;margin-bottom:6px}
.narr{font-size:13.5px;color:#c4d5ea}
.narr b{color:#fff}
.prog{height:4px;background:#1a2940;border-radius:2px;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#22d3ee)}
ol.phases{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:4px}
ol.phases li{font-size:12px;padding:4px 7px;border-radius:5px;background:#142034;cursor:pointer;border:1px solid transparent;color:var(--mut)}
ol.phases li.done{color:#9fb6d3}
ol.phases li.cur{border-color:#3b82f6;color:#fff;background:#1a2d4b}
.ro{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.ro span:nth-child(odd){color:var(--mut)}
.ro span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right;color:#fff}
.st{display:inline-block;padding:0 6px;border-radius:4px;font-size:11.5px;background:#26364d;color:#9fb0c6}
.st.ok{background:#14532d;color:#86efac}.st.bad{background:#7f1d1d;color:#fecaca}.st.warn{background:#713f12;color:#fde68a}
.log{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#9fb6d3;max-height:150px;overflow:auto;background:#0c1522;border:1px solid var(--line);border-radius:6px;padding:6px}
.log div{white-space:nowrap}
.log .t{color:#5f7593}
.legend{display:flex;flex-wrap:wrap;gap:5px;padding:4px 8px 8px}
.legend button{font-size:12px;padding:3px 9px;display:flex;gap:6px;align-items:center}
.legend button i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend button.off{opacity:.4}
#tip{position:fixed;pointer-events:none;background:#0d1828;border:1px solid #35537d;border-radius:6px;padding:6px 9px;font-size:12.5px;max-width:280px;display:none;z-index:9;box-shadow:0 6px 20px #0008}
#tip b{color:#fff}
.foot{color:var(--mut);font-size:11.5px;padding:0 12px 10px}
svg text{font-family:"Segoe UI",Roboto,system-ui,sans-serif}
.lbl{fill:#cfe0f5;font-size:13px}
.tag{fill:#8fb3da;font-size:11.5px}
.big{fill:#e6f0ff;font-size:14px;font-weight:600}
.hot [data-tip]{cursor:help}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);max-height:none}}

#topnav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:7px 16px;background:#070d16;border-bottom:1px solid var(--line)}
#topnav .brand{display:flex;flex-direction:column;line-height:1.2}
#topnav .brand b{font-size:13.5px;color:#fff}#topnav .brand span{font-size:11.5px;color:var(--mut)}
.tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tabs .arr{color:#3b5576;font-size:18px}
.tab{font-size:13.5px;padding:7px 14px;border-radius:8px;background:#111d2e;border-color:#25395a}
.tab i{font-style:normal;color:#60a5fa;margin-right:4px}
.tab.on{background:linear-gradient(90deg,#1d4ed8,#0e7490);border-color:#38bdf8;color:#fff}.tab.on i{color:#fff}
.view .wrap,#viewGtc .wrap{min-height:calc(100vh - 104px)}
.view aside,#viewGtc aside{max-height:calc(100vh - 104px)}
.gobtn{display:block;width:100%;margin:12px 0 2px;padding:9px 12px;font-size:13.5px;font-weight:600;background:linear-gradient(90deg,#1d4ed8,#0e7490);border-color:#38bdf8;text-align:left}
.gobtn:hover{filter:brightness(1.15)}
.gobtn.back{background:#172438;border-color:#2a3d59;font-weight:500;font-size:12.5px}
.stlg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:3px 6px}
.stlg i{width:16px;height:11px;border:1.5px solid;border-radius:3px;display:inline-block}
.tipbox{position:fixed;pointer-events:none;background:#0d1828;border:1px solid #35537d;border-radius:6px;padding:6px 9px;font-size:12.5px;max-width:300px;display:none;z-index:9;box-shadow:0 6px 20px #0008}
.tipbox b{color:#fff}
#xPlant [data-tip]{cursor:help}
.vt{fill:#e6f0ff;font-size:11.5px;font-weight:600}
.vt2{fill:#cfe0f5;font-size:11px;font-weight:600}
.atx{font-size:11px;font-weight:600;letter-spacing:.04em}
.bxt{font-size:11.5px;font-weight:600}
.bxv{font-size:11.5px}
.lit{font-size:12.5px}
.modesw{display:inline-flex;margin-left:6px;border:1px solid #2a3d59;border-radius:7px;overflow:hidden}.modesw button{border:0;border-radius:0;font-weight:600;letter-spacing:.06em}.modesw button.on{background:#15803d;color:#fff}
.pvt{fill:#e6f0ff;font-size:13px;font-weight:600}
.ptg{fill:#8fb3da;font-size:12px}
</style>
</head>
<body>
<nav id="topnav">
  <div class="brand"><b>Block B · CPP</b><span>Start-up &amp; Hydrocarbon Commissioning · Train 1</span></div>
  <div class="tabs">
    <button class="tab" data-view="sequence"><i>⓪</i> Commissioning sequence</button>
    <span class="arr">›</span>
    <button class="tab" data-view="prep"><i>①</i> Preparation (RFSU)</button>
    <span class="arr">›</span>
    <button class="tab" data-view="startup"><i>②</i> Hydrocarbon start-up</button>
  </div>
</nav>

<section id="viewX" class="view">
<header>
  <div>
    <h1 id="xTitle">–</h1>
    <div class="sub" id="xSub"></div>
  </div>
  <div class="ctl">
    <button id="xPrev">◀ Previous</button>
    <button id="xPlay">▶ Play</button>
    <button id="xNext">Next ▶</button>
    <button id="xRestart">⟲ Restart</button>
    <span class="modesw"><button id="xAuto" class="on">AUTO</button><button id="xMan">MANUAL</button></span>
    <button data-xsp="0.5">0.5×</button><button data-xsp="1" class="on">1×</button><button data-xsp="2">2×</button><button data-xsp="4">4×</button>
  </div>
</header>
<div class="wrap">
  <div class="stage">
    <div class="legend" id="xLegend"></div>
    <svg id="xPlant" viewBox="0 0 1600 850" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="foot" id="xFoot"></div>
  </div>
  <aside>
    <div class="phase-now" id="xName">–</div>
    <div class="phase-real" id="xReal"></div>
    <div class="prog"><i id="xBar"></i></div>
    <div class="narr" id="xText"></div>
    <div id="xGo"></div>
    <h2>Steps</h2>
    <ol class="phases" id="xList"></ol>
    <div id="xRo"></div>
    <div id="xExtra"></div>
    <h2>Event log</h2>
    <div class="log" id="xLog"></div>
  </aside>
</div>
<div id="xTip" class="tipbox"></div>
</section>


<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const svg=$('xPlant');
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, lerp=(a,b,t)=>a+(b-a)*t, clamp=v=>Math.max(0,Math.min(1,v));
const tip=(t,d)=>`data-tip="${t}" data-desc="${d}"`;
const fmt=(x,d=0)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const chip=(cls,t)=>`<i class="st ${cls}">${t}</i>`;

/* =====================================================================
   SCENARIO 0 – HYDROCARBON COMMISSIONING SEQUENCE (slide 6)
   ===================================================================== */
const CAT={tmp:['Temp. system','#7e22ce'],perm:['System permanent to be used offshore','#16a34a'],nhc:['Offshore non-hydrocarbon commissioning','#c2410c'],hc:['System start-up hydrocarbon commissioning','#ca8a04']};
const COLS=[
 ['tmp',[['Temp Power Supply','']]],
 ['perm',[['LV Power Distribution','CPPT-65'],['UPS Power System','CPPT-63'],['General Lighting / Small Power','CPPT-66']]],
 ['perm',[['Control System (PCS)','CPPT-70'],['Pedestal Cranes','CPPT-91'],['Instrument Air (in service)','CPPT-50'],['Utility Air (in service)','CPPT-51'],['Service Water Distribution','CPPT-57'],['Potable Water Storage &amp; Pumps','CPPT-58']]],
 ['perm',[['ESD System','CPPT-71'],['Inert Gas','CPPT-52'],['Diesel Centrifuge Package','CPPT-54'],['Diesel Firewater Pump','CPPT-80'],['Deluge System','CPPT-82'],['HVAC','CPPT-90']]],
 ['perm',[['Fire &amp; Gas System','CPPT-72'],['Open Drain – Non Hazardous','CPPT-45'],['Lifeboats','CPPT-86'],['Hot Water','CPPT-49'],['Sewage / Sanitary','CPPT-55'],['Telecom / PAGA / CCTV / SCADA','CPPT-73/74/75']]],
 ['nhc',[['Closed Drain','CPPT-47'],['Chemical Storage &amp; Distribution (top-up)','CPPT-53'],['HP Flare KO Drum &amp; Transfer Pumps','CPPT-42'],['LP Flare KO Drum &amp; Transfer Pumps','CPPT-43'],['Open Drain – Hazardous','CPPT-48'],['Hydraulic Power Unit (with TUTU)','CPPT-04']]],
 ['nhc',[['Inlet Separator','CPPT-34'],['Three Phase Separator','CPPT-34'],['Water Injection Pump','CPPT-36']]],
 ['nhc',[['GTG (DO Mode)','CPPT-60'],['Power Management System','CPPT-65'],['HV Switchgear 6.6 kV (6401)','CPPT-64'],['Power Transformer 6000/420 V','CPPT-64-02/03/04'],['LV Power Distribution','CPPT-65']]],
 ['hc',[['Utility Gas Supply &amp; Distribution','CPPT-40'],['Fuel Gas','CPPT-38'],['Production Compressor','CPPT-11'],['Glycol Dehydration','CPPT-12'],['Turbo Expander Package','CPPT-13']]],
 ['hc',[['Mercury Removal Unit','CPPT-14'],['Pipeline Compressor','CPPT-15'],['Waste Heat Recovery Unit','CPPT-56'],['Condensate Stabilizer','CPPT-34'],['Vapour Recovery Compressor','CPPT-30']]],
 ['hc',[['Sales Gas Analyzer Shelter','CPPT-31'],['Sales Gas Metering','CPPT-31'],['Produced Water Treatment Package','CPPT-36'],['GTG (Gas Mode)','CPPT-60']]],
];
const CX=i=>22+i*143, CW=126, RY=r=>104+r*66, RH=54;
const K0=[],LAB0={};COLS.forEach(([c,items],i)=>items.forEach((it,r)=>{const k=`q${i}_${r}`;K0.push([k,c,i,r]);LAB0[k]=it[0]+(it[1]?' ('+it[1]+')':'')}));
const colKeys=i=>K0.filter(x=>x[2]===i).map(x=>x[0]);
const colDone=(S,i)=>colKeys(i).every(k=>S[k]>=1);
function wrap(s,n){const w=s.replace(/&amp;/g,'&').split(' ');const L=[];let l='';w.forEach(x=>{if((l+' '+x).trim().length>n){L.push(l.trim());l=x}else l+=' '+x});if(l.trim())L.push(l.trim());return L.map(x=>x.replace(/&/g,'&amp;'))}

const SC0={
 key:'sequence',
 title:'⓪ Hydrocarbon commissioning sequence',
 sub:'Order in which systems are commissioned, per slide 6 · temporary power → permanent systems → non-HC commissioning → HC start-up · <b style="color:#86efac">green = commissioned</b>',
 foot:'Column header colours follow slide 6: purple = temporary system, green = permanent systems used offshore, orange = offshore non-hydrocarbon commissioning, gold (red dashed frame) = systems started up with hydrocarbons. The HC columns are completed during ② Hydrocarbon start-up, after the RFSU certificate (①).',
 s0:{},
 legend:[['seq','Commissioning sequence','#94a3b8'],['done','Commissioned','#22c55e']],
 lab:LAB0,
 build(){
  let h='';
  const band=(i0,i1,c)=>{const x=CX(i0)-6,w=CX(i1)+CW-CX(i0)+12;h+=`<rect x="${x}" y="30" width="${w}" height="30" rx="4" fill="${CAT[c][1]}" opacity=".9"/><text x="${x+w/2}" y="50" text-anchor="middle" style="font-size:${w<200?11:13}px;font-weight:700;fill:#fff">${CAT[c][0]}</text>`};
  band(0,0,'tmp');band(1,4,'perm');band(5,7,'nhc');band(8,10,'hc');
  h+=`<rect x="${CX(8)-14}" y="22" width="${CX(10)+CW-CX(8)+28}" height="470" rx="8" fill="rgba(202,138,4,.05)" stroke="#ef4444" stroke-width="2" stroke-dasharray="10 6"/>`;
  K0.forEach(([k,c,i,r])=>{const [n,t]=COLS[i][1][r];const x=CX(i),y=i===0?RY(2):RY(r);const L=wrap(n,19);
   h+=`<g id="q_${k}" ${tip(n+(t?' · '+t:''),CAT[c][0]+(c==='hc'?' – started in ② Hydrocarbon start-up':''))}>
    <rect class="qr" x="${x}" y="${y}" width="${CW}" height="${RH}" rx="5"/>
    <rect x="${x}" y="${y}" width="5" height="${RH}" rx="2" fill="${CAT[c][1]}"/>
    ${L.map((l,j)=>`<text class="qt" x="${x+12}" y="${y+(t?17:22)+j*13-(L.length-1)*4}" style="font-size:11px;font-weight:600">${l}</text>`).join('')}
    ${t?`<text class="qg" x="${x+12}" y="${y+RH-7}" style="font-size:9.5px;letter-spacing:.04em">${t}</text>`:''}
    <g class="qc" opacity="0"><circle cx="${x+CW-11}" cy="${y+11}" r="7.5" fill="#16a34a"/><path d="M${x+CW-15} ${y+11} l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/></g></g>`});
  // progress bars
  h+=`<text x="22" y="540" style="font-size:12px;font-weight:700;fill:#e2e8f0;letter-spacing:.1em">PROGRESS BY GROUP</text>`;
  [['tmp','perm'],['nhc'],['hc']].forEach((cs,j)=>{const y=560+j*58;const lbl=cs.map(c=>CAT[c][0]).join(' + ');
   h+=`<text x="22" y="${y+14}" style="font-size:12px;fill:#cbd5e1">${lbl}</text><rect x="22" y="${y+22}" width="900" height="14" rx="7" fill="#1e293b"/><rect id="pb${j}" x="22" y="${y+22}" width="0" height="14" rx="7" fill="${CAT[cs[cs.length-1]][1]}"/><text id="pt${j}" x="932" y="${y+34}" style="font-size:12px;fill:#e2e8f0;font-weight:600"></text>`});
  h+=`<g ${tip('Link to the other views','The permanent and non-HC columns must be complete before RFSU (①). The gold HC columns are the steps animated in ② Hydrocarbon start-up.')}><rect x="1010" y="540" width="568" height="170" rx="8" fill="#0c1522" stroke="#2a3d59"/>
   <text x="1026" y="563" style="font-size:12px;font-weight:700;fill:#e2e8f0;letter-spacing:.1em">WHERE EACH HC SYSTEM STARTS IN ②</text>
   ${[['Utility gas / Fuel gas','Step 3'],['GTG (gas mode)','Step 4'],['Produced water treatment','Step 5'],['Condensate stabilizer, VRU','Step 6'],['Prod. &amp; pipeline compressor, glycol, MRU, turbo-expander (JT bypass), WHRU','Step 7'],['Sales gas metering &amp; analyzer','Step 8']].map(([a,b],i)=>`<text x="1026" y="${586+i*20}" style="font-size:11.5px;fill:#cbd5e1">${a}</text><text x="1562" y="${586+i*20}" text-anchor="end" style="font-size:11.5px;font-weight:700;fill:#fde68a">${b}</text>`).join('')}</g>`;
  return h;
 },
 flows(){const F=[];
  for(let i=1;i<COLS.length;i++){const bx=CX(i)-9;const ks=colKeys(i);const yTop=88,yBot=RY(ks.length-1)+RH/2;
   F.push({sys:'seq',c:'#94a3b8',cf:S=>colDone(S,i-1)?'#22c55e':'#475569',d:`M${CX(i-1)-9+(i===1?9+CW:0)} ${i===1?RY(2)+RH/2:88} ${i===1?`H${bx} V88`:`H${bx}`}`,v:S=>colDone(S,i-1)?1:0,w:3,dash:'5 8',base:1});
   F.push({sys:'seq',c:'#94a3b8',cf:S=>colDone(S,i-1)?'#22c55e':'#475569',d:`M${bx} ${yTop} V${yBot}`,v:S=>colDone(S,i-1)?1:0,w:3,dash:'5 8',base:1});
   ks.forEach((k,r)=>F.push({sys:'seq',c:'#94a3b8',cf:S=>S[k]>=1?'#22c55e':'#475569',d:`M${bx} ${RY(r)+RH/2} H${CX(i)}`,v:S=>S[k]>0?1:0,w:2,dash:'3 6',base:1}));}
  return F},
 P:(()=>{const P=[{n:'Overview',real:'Slide 6 · HC commissioning sequence',dur:5,
   x:'Slide 6 shows the order in which <b>50 systems</b> are commissioned, left to right:<br>• <b style="color:#c084fc">Temporary power</b> energises the first permanent boards.<br>• <b style="color:#4ade80">Permanent systems</b> (power, control, air, water, safety, F&amp;G, telecom) – required before any hydrocarbon work.<br>• <b style="color:#fb923c">Offshore non-HC commissioning</b>: drains, chemicals, flare KO drums, separators, GTG on diesel, HV/LV power.<br>• <b style="color:#facc15">HC start-up systems</b> (red dashed frame) – commissioned with hydrocarbons in ② after RFSU.'}];
  const N=['Temporary & LV power','Control, air & water','ESD, inert gas, diesel, firewater','F&G, drains, lifeboats, telecom','Drains, chemicals, flare KO drums','Separators & water injection','GTG (DO) & power distribution','HC start-up – group 1','HC start-up – group 2','HC start-up – group 3'];
  const X=['Temporary power supplies <b>LV Power Distribution (CPPT-65)</b>, then <b>UPS (CPPT-63)</b> and <b>general lighting / small power (CPPT-66)</b>.',
   '<b>PCS (CPPT-70)</b>, pedestal cranes, <b>instrument air</b> and <b>utility air</b> put in service, service water and potable water.',
   '<b>ESD system (CPPT-71)</b>, inert gas, diesel centrifuge, <b>diesel firewater pump</b>, <b>deluge</b> and HVAC.',
   '<b>Fire &amp; gas (CPPT-72)</b>, non-hazardous open drain, lifeboats, hot water, sewage, telecom / PAGA / CCTV / SCADA. Permanent systems complete.',
   'Offshore non-HC commissioning: <b>closed drain</b>, chemical storage (top-up), <b>HP and LP flare KO drums &amp; transfer pumps</b>, hazardous open drain, HPU with TUTU.',
   '<b>Inlet separator</b> and <b>three-phase separator</b> (CPPT-34) and the water injection pump (CPPT-36), dry / non-HC.',
   '<b>GTG on diesel (CPPT-60)</b>, power management system, <b>6.6 kV HV switchgear</b>, power transformers 6000/420 V and LV distribution. Non-HC commissioning complete → <b>RFSU</b> (①).',
   'With hydrocarbons (②): <b>utility gas</b>, <b>fuel gas</b>, <b>production compressor</b>, <b>glycol dehydration</b>, <b>turbo-expander package</b> (started on the JT bypass).',
   'With hydrocarbons (②): <b>MRU</b>, <b>pipeline compressor</b>, <b>WHRU</b>, <b>condensate stabilizer</b>, <b>vapour recovery compressor</b>.',
   'With hydrocarbons (②): <b>sales gas analyzer</b> and <b>metering</b>, <b>produced water treatment</b>, and finally <b>GTG in gas mode</b>.'];
  const R=['Temp → permanent','Permanent','Permanent','Permanent','Non-HC','Non-HC','Non-HC → RFSU','HC start-up (②)','HC start-up (②)','HC start-up (②)'];
  for(let j=0;j<10;j++){const cols=j===0?[0,1]:[j+1];const seq=[];cols.forEach(c=>seq.push(...colKeys(c)));
   const ph={n:N[j],real:R[j],dur:j===9?Infinity:Math.max(6,seq.length*1.4),seq,x:X[j]};
   if(j===9)ph.go=['prep',0,'Go to ① Preparation (RFSU) ▶'];
   if(j===9){ph.dur=8;P.push(ph);P.push({n:'Sequence complete',real:'All 50 systems',dur:Infinity,x:'All systems in the slide 6 sequence are commissioned. Continue with <b>① RFSU pre-requisites</b> and <b>② Hydrocarbon start-up</b> for the detail of each step.',go:['prep',0,'Go to ① Preparation (RFSU) ▶']});delete ph.go}
   else P.push(ph)}
  return P})(),
 ro(S){const cnt=cs=>{const ks=K0.filter(x=>cs.includes(x[1])).map(x=>x[0]);return [ks.filter(k=>S[k]>=1).length,ks.length]};
  const a=cnt(['tmp','perm']),b=cnt(['nhc']),c=cnt(['hc']),t=cnt(['tmp','perm','nhc','hc']);
  return [['Systems commissioned',`${t[0]} / ${t[1]}`],['Temp + permanent',`${a[0]} / ${a[1]}`],['Offshore non-HC',`${b[0]} / ${b[1]}`],['HC start-up',`${c[0]} / ${c[1]}`],
   ['Ready for RFSU',a[0]===a[1]&&b[0]===b[1]?chip('ok','YES'):chip('','NOT YET')]]},
 roTitle:'Progress',

  K0.forEach(([k])=>{const g=$('q_'+k);const v=S[k]||0;const st=v>=1?2:v>0?1:0;if(g._st===st&&st!==1)return;g._st=st;const r=g.querySelector('.qr');

function draw(dt,now){
 _dt=dt;
 flowEls.forEach(o=>{const v=o.f.v(S);if(o.f.cf){const c=o.f.cf(S);if(o.c!==c){o.c=c;o.p.setAttribute('stroke',c);o.b.setAttribute('stroke',c)}}o.off-=v*dt*70;o.p.setAttribute('stroke-dashoffset',o.off.toFixed(1));const dm=o.dim==null?1:o.dim;o.p.style.opacity=sysOn[o.f.sys]?(v>0.02?Math.min(1,0.25+v)*dm:0):0;o.b.style.opacity=(sysOn[o.f.sys]?1:.15)*(dm<1?.4:1)});
 SC.draw(S,now,dt,rot);
 const rows=SC.ro(S);const g=$('xRoG');
 if(g&&roKeys!==rows.length){roKeys=rows.length;g.innerHTML=rows.map((r,i)=>`<span>${r[0]}</span><span id="ro${i}"></span>`).join('');for(const k in cache)if(k.startsWith('ro'))delete cache[k]}
 rows.forEach((r,i)=>setH('ro'+i,r[1]));
 if(SC.extra){const ex=SC.extra(S,idx);if(cache.__ex!==ex){cache.__ex=ex;$('xExtra').innerHTML=ex}}
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(SC){if(playing)step(dt*speed);draw(playing?dt*speed:0,now)}
 requestAnimationFrame(loop)}

// controls
const bPlay=$('xPlay');
function setPlay(v){playing=v;bPlay.textContent=playing?'⏸ Pause':'▶ Play';bPlay.classList.toggle('on',playing)}
bPlay.onclick=()=>setPlay(!playing);
$('xRestart').onclick=()=>{load(SC,0)};
function setMode(a){auto=a;$('xAuto').classList.toggle('on',a);$('xMan').classList.toggle('on',!a);if(SC)log(a?'Mode: AUTO – steps run in sequence':'Mode: MANUAL – each step holds until Next')}
$('xAuto').onclick=()=>setMode(true);$('xMan').onclick=()=>setMode(false);
$('xNext').onclick=()=>{if(idx<SC.P.length-1){snap(phase);startPhase(idx+1);log('→ '+phase.n);setPlay(true)}};
$('xPrev').onclick=()=>{if(idx>0){jump(idx-1);setPlay(true)}};
document.querySelectorAll('[data-xsp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.xsp;document.querySelectorAll('[data-xsp]').forEach(x=>x.classList.toggle('on',x===b))});
// tooltip
const tipEl=$('xTip');
svg.addEventListener('mousemove',ev=>{const t=ev.target.closest('[data-tip]');if(!t){tipEl.style.display='none';return}
 tipEl.innerHTML=`<b>${t.dataset.tip}</b><br>${t.dataset.desc}`;tipEl.style.display='block';
 const x=Math.min(ev.clientX+14,innerWidth-300);tipEl.style.left=x+'px';tipEl.style.top=(ev.clientY+14)+'px'});
svg.addEventListener('mouseleave',()=>tipEl.style.display='none');

// view switching
const SCS={sequence:SC0,prep:SC1,startup:SC2};
function goView(v,i){
 if(!['sequence','prep','startup'].includes(v))v='sequence';
 document.body.dataset.view=v;
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
 if(SC!==SCS[v]||i!=null)load(SCS[v],i||0);
 try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}catch(e){}
 window.scrollTo(0,0);
}
window.goView=goView;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>goView(t.dataset.view));
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){const gi=b.dataset.gi;goView(b.dataset.go,gi==null?null:+gi)}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==document.body.dataset.view)goView(v)});
window.__startX=()=>{goView((location.hash||'#sequence').slice(1));requestAnimationFrame(loop)};
})();
</script>
<script>window.__startX();</script>
</body>
</html>
